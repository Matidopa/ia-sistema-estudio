<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>IA · Sistema de estudio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%231d3f8f'/%3E%3Ccircle cx='16' cy='10' r='3' fill='white'/%3E%3Ccircle cx='10' cy='22' r='3' fill='white'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%23a6eb7e'/%3E%3Cpath d='M16 10 10 22M16 10 22 22' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/v3.css">
  <script src="vendor/marked.min.js"></script>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>
  <div class="marco">
    <aside class="lateral" id="lateral">
      <div class="lat-cabeza">
        <a class="marca" href="#/">Inteligencia Artificial<small>Sistema de estudio · UTN FRBA</small></a>
        <div class="guardado-movil" id="guardado-movil"></div>
        <button class="btn-menu" id="btn-menu" type="button" aria-expanded="false" aria-controls="lat-cuerpo" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
      <div class="lat-cuerpo" id="lat-cuerpo">
        <nav aria-label="Secciones">
          <ul class="nav" id="nav">
            <li><a href="#/"><span>Inicio</span></a></li>
            <li><a href="#/expres" data-modo="expres"><span>Plan exprés</span></a></li>
            <li><a href="#/ruta" data-modo="completo"><span>Ruta completa</span></a></li>
            <li><a href="#/practica"><span>Práctica</span></a></li>
            <li><a href="#/examen"><span>Simulacro de parcial</span></a></li>
            <li><a href="#/parciales"><span>Parciales reales</span></a></li>
            <li><a href="#/repaso"><span>Repaso</span> <span class="cuenta" id="cuenta-repaso" hidden>0</span></a></li>
            <li><a href="#/tarjetas"><span>Tarjetas de memoria</span></a></li>
            <li><a href="#/catedra"><span>Ejercicios de la cátedra</span></a></li>
            <li><a href="#/simuladores"><span>Simuladores</span></a></li>
            <li><a href="#/ajustes"><span>Ajustes</span></a></li>
          </ul>
        </nav>
        <h2>Unidades</h2>
        <ul class="ruta-mini" id="ruta-mini"></ul>
      </div>
      <div class="panel-guardado" id="panel-guardado"></div>
    </aside>
    <main class="contenido" id="principal" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>
  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Si a los 8 segundos la app no arrancó, mostramos por qué en vez de quedar "Cargando…" para siempre.
    setTimeout(function () {
      var c = document.querySelector('#principal .cargando');
      if (!c) return;
      var local = location.protocol === 'file:';
      c.innerHTML = local
        ? 'Abriste el archivo directamente. Cerrá esta pestaña y abrí la app con <b>iniciar.bat</b>.'
        : 'La app no arrancó. Cerrá la ventana negra, volvé a abrir <b>iniciar.bat</b> y recargá con Ctrl+F5. Si sigue igual, apretá F12, pestaña Console, y pasame el error en rojo.';
    }, 8000);
  </script>
</body>
</html>
